<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>{{DOC_TITLE}}</title>
<style>
body{max-width:880px;margin:0 auto;padding:44px 40px 60px;background:#fff;color:#1F2329;font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:15px;line-height:1.8}
h1{font-size:27px;margin:0 0 8px;font-weight:600}
.sub{color:#646A73;font-size:14px;margin:0 0 28px}
.badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:4px;background:#E8F7CF;color:#2B4B06;margin-left:8px;vertical-align:middle}
.badge.wait{background:#F0F1F2;color:#373C43}
h2{font-size:19px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid #DEE0E3;font-weight:600}
table{border-collapse:collapse;width:100%;margin:12px 0 18px}
th,td{border:1px solid #DEE0E3;padding:9px 13px;text-align:left;vertical-align:top;font-size:14px}
th{background:#F5F6F7;font-weight:600;width:150px;white-space:nowrap}
ul{margin:8px 0 16px;padding-left:22px}
li{margin:4px 0}
pre{background:#F5F6F7;border:1px solid #DEE0E3;border-radius:6px;padding:15px 17px;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.75;font-family:'SFMono-Regular',Consolas,'Microsoft YaHei',monospace}
.figure{margin:14px 0;border:1px solid #DEE0E3;border-radius:6px;padding:12px;background:#FAFBFC;text-align:center}
.figure img{display:block;max-width:100%;margin:0 auto;border:1px solid #E4E6E8}
.figure.flow{background:#101210;border-color:#101210}
.figure.flow img{border-color:#3A443A}
.figure.video{border-color:#BDFE32;background:#F7FCEB}
.figure.video img{border-color:#C9E29A}
.figure.video .cap{color:#374A12}
.figure .cap{font-size:13px;color:#646A73;margin-top:9px}
.note{background:#F7F8F5;border-left:3px solid #BDFE32;padding:10px 14px;margin:14px 0;font-size:14px;color:#373C43}
footer{margin-top:44px;padding-top:16px;border-top:1px solid #DEE0E3;color:#646A73;font-size:13px;line-height:1.8}
</style></head>
<body>{{DOC_BODY}}</body></html>
