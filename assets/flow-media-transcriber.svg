<svg xmlns="http://www.w3.org/2000/svg" width="936" height="270" viewBox="0 0 936 270" role="img" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif"><title>音视频转录与长文整理：输入、流程与输出</title><desc>左列是要准备的输入，中列是制作流程步骤，右列是最终交付物。</desc><defs><marker id="arw-media-transcriber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BDFE32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="280" height="270" rx="16" fill="#171B17" stroke="#3A443A" stroke-width="1"/><text x="22" y="42" font-size="28" font-weight="600" fill="#BDFE32">输入</text><rect x="22" y="56" width="46" height="5" rx="2.5" fill="#BDFE32"/><circle cx="30" cy="84" r="4.5" fill="#BDFE32"/><text x="48" y="92" font-size="25" fill="#F1F2EC">音视频 / 本地文件</text><circle cx="30" cy="120" r="4.5" fill="#BDFE32"/><text x="48" y="128" font-size="25" fill="#F1F2EC">字幕 / 转录 JSON</text><circle cx="30" cy="156" r="4.5" fill="#BDFE32"/><text x="48" y="164" font-size="25" fill="#F1F2EC">会议逐字稿</text><circle cx="30" cy="192" r="4.5" fill="#BDFE32"/><text x="48" y="200" font-size="25" fill="#F1F2EC">指定的输出类型</text><rect x="328" y="0" width="280" height="270" rx="16" fill="#171B17" stroke="#3A443A" stroke-width="1"/><text x="350" y="42" font-size="28" font-weight="600" fill="#BDFE32">流程</text><rect x="350" y="56" width="46" height="5" rx="2.5" fill="#BDFE32"/><text x="350" y="92" font-size="24" font-weight="600" fill="#BDFE32">01</text><text x="400" y="92" font-size="25" fill="#F1F2EC">确认输入建目录</text><text x="350" y="128" font-size="24" font-weight="600" fill="#BDFE32">02</text><text x="400" y="128" font-size="25" fill="#F1F2EC">取得完整原文</text><text x="350" y="164" font-size="24" font-weight="600" fill="#BDFE32">03</text><text x="400" y="164" font-size="25" fill="#F1F2EC">检查转录质量</text><text x="350" y="200" font-size="24" font-weight="600" fill="#BDFE32">04</text><text x="400" y="200" font-size="25" fill="#F1F2EC">按要求生成文稿</text><text x="350" y="236" font-size="24" font-weight="600" fill="#BDFE32">05</text><text x="400" y="236" font-size="25" fill="#F1F2EC">核对并交付</text><rect x="656" y="0" width="280" height="270" rx="16" fill="#171B17" stroke="#3A443A" stroke-width="1"/><text x="678" y="42" font-size="28" font-weight="600" fill="#BDFE32">输出</text><rect x="678" y="56" width="46" height="5" rx="2.5" fill="#BDFE32"/><circle cx="686" cy="84" r="4.5" fill="#BDFE32"/><text x="704" y="92" font-size="25" fill="#F1F2EC">完整中文整理稿</text><circle cx="686" cy="120" r="4.5" fill="#BDFE32"/><text x="704" y="128" font-size="25" fill="#F1F2EC">简短摘要（可选）</text><circle cx="686" cy="156" r="4.5" fill="#BDFE32"/><text x="704" y="164" font-size="25" fill="#F1F2EC">带时间戳稿件</text><circle cx="686" cy="192" r="4.5" fill="#BDFE32"/><text x="704" y="200" font-size="25" fill="#F1F2EC">原始逐字稿</text><path d="M286 135 H320" fill="none" stroke="#BDFE32" stroke-width="2.6" marker-end="url(#arw-media-transcriber)"/><path d="M614 135 H648" fill="none" stroke="#BDFE32" stroke-width="2.6" marker-end="url(#arw-media-transcriber)"/></svg>