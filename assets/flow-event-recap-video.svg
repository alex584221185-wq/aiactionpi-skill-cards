<svg xmlns="http://www.w3.org/2000/svg" width="936" height="270" viewBox="0 0 936 270" role="img" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif"><title>活动回顾视频：输入、流程与输出</title><desc>左列是要准备的输入，中列是制作流程步骤，右列是最终交付物。</desc><defs><marker id="arw-event-recap-video" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BDFE32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="280" height="270" rx="16" fill="#171B17" stroke="#3A443A" stroke-width="1"/><text x="22" y="42" font-size="28" font-weight="600" fill="#BDFE32">输入</text><rect x="22" y="56" width="46" height="5" rx="2.5" fill="#BDFE32"/><circle cx="30" cy="84" r="4.5" fill="#BDFE32"/><text x="48" y="92" font-size="25" fill="#F1F2EC">活动总结与逐字稿</text><circle cx="30" cy="120" r="4.5" fill="#BDFE32"/><text x="48" y="128" font-size="25" fill="#F1F2EC">现场照片 / 视频</text><circle cx="30" cy="156" r="4.5" fill="#BDFE32"/><text x="48" y="164" font-size="25" fill="#F1F2EC">品牌参考</text><circle cx="30" cy="192" r="4.5" fill="#BDFE32"/><text x="48" y="200" font-size="25" fill="#F1F2EC">发布位置与画幅</text><circle cx="30" cy="228" r="4.5" fill="#BDFE32"/><text x="48" y="236" font-size="25" fill="#F1F2EC">候选音乐（可选）</text><rect x="328" y="0" width="280" height="270" rx="16" fill="#171B17" stroke="#3A443A" stroke-width="1"/><text x="350" y="42" font-size="28" font-weight="600" fill="#BDFE32">流程</text><rect x="350" y="56" width="46" height="5" rx="2.5" fill="#BDFE32"/><text x="350" y="92" font-size="24" font-weight="600" fill="#BDFE32">01</text><text x="400" y="92" font-size="25" fill="#F1F2EC">整理现场</text><text x="350" y="128" font-size="24" font-weight="600" fill="#BDFE32">02</text><text x="400" y="128" font-size="25" fill="#F1F2EC">选曲核许可</text><text x="350" y="164" font-size="24" font-weight="600" fill="#BDFE32">03</text><text x="400" y="164" font-size="25" fill="#F1F2EC">围绕音乐编排</text><text x="350" y="200" font-size="24" font-weight="600" fill="#BDFE32">04</text><text x="400" y="200" font-size="25" fill="#F1F2EC">成片与封面</text><rect x="656" y="0" width="280" height="270" rx="16" fill="#171B17" stroke="#3A443A" stroke-width="1"/><text x="678" y="42" font-size="28" font-weight="600" fill="#BDFE32">输出</text><rect x="678" y="56" width="46" height="5" rx="2.5" fill="#BDFE32"/><circle cx="686" cy="84" r="4.5" fill="#BDFE32"/><text x="704" y="92" font-size="25" fill="#F1F2EC">完整视频</text><circle cx="686" cy="120" r="4.5" fill="#BDFE32"/><text x="704" y="128" font-size="25" fill="#F1F2EC">可编辑工程</text><circle cx="686" cy="156" r="4.5" fill="#BDFE32"/><text x="704" y="164" font-size="25" fill="#F1F2EC">指定比例封面</text><circle cx="686" cy="192" r="4.5" fill="#BDFE32"/><text x="704" y="200" font-size="24" fill="#F1F2EC">推荐标题与检查记录</text><path d="M286 135 H320" fill="none" stroke="#BDFE32" stroke-width="2.6" marker-end="url(#arw-event-recap-video)"/><path d="M614 135 H648" fill="none" stroke="#BDFE32" stroke-width="2.6" marker-end="url(#arw-event-recap-video)"/></svg>